# prod environment. Deployed by GitHub Actions:
#   IMAGE_TAG=<tag> docker compose -f deploy/compose.prod.yml up -d
services:
  web-prod:
    image: ghcr.io/${GITHUB_REPOSITORY:-rgtdev95/personal-site}:${IMAGE_TAG:-prod-latest}
    restart: unless-stopped
    env_file: .env.prod
    read_only: true
    tmpfs: [/tmp]
    networks: [web]

networks:
  web:
    external: true
