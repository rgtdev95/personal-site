# test environment. Deployed by GitHub Actions:
#   IMAGE_TAG=<tag> docker compose -f deploy/compose.test.yml up -d
services:
  web-test:
    image: ghcr.io/${GITHUB_REPOSITORY:-rgtdev95/personal-site}:${IMAGE_TAG:-test-latest}
    restart: unless-stopped
    env_file: .env.test
    read_only: true
    tmpfs: [/tmp]
    networks: [web]

networks:
  web:
    external: true
